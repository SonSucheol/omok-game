[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omok-game"
version = "0.1.0"
description = "Kakao-style multiplayer Omok game in Python"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5.0",
]

[project.scripts]
omok = "main:main"
